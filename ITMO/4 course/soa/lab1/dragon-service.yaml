components:
  schemas:
    Dragon:
      type: object
      required:
      - id
      - name
      - coordinates
      - creationDate
      - wingspan
      - speaking
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Уникальный идентификатор дракона, генерируется автоматически
        name:
          type: string
          minLength: 1
          description: Имя дракона. Не может быть пустым
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date-time
          readOnly: true
          description: Дата создания объекта, генерируется автоматически
        age:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Возраст дракона. Если указан, должен быть больше 0
        wingspan:
          type: integer
          format: int64
          minimum: 1
          description: Размах крыльев. Должен быть больше 0
        speaking:
          type: boolean
          description: Умеет ли дракон говорить
        color:
          allOf:
          - $ref: '#/components/schemas/Color'
          nullable: true
          description: Цвет дракона
        killer:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
          description: Человек, убивший дракона
      xml:
        name: dragon
    DragonInput:
      type: object
      required:
      - name
      - coordinates
      - wingspan
      - speaking
      properties:
        name:
          type: string
          minLength: 1
          description: Имя дракона. Не может быть пустым
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        age:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Возраст дракона. Если указан, должен быть больше 0
        wingspan:
          type: integer
          format: int64
          minimum: 1
          description: Размах крыльев. Должен быть больше 0
        speaking:
          type: boolean
          description: Умеет ли дракон говорить
        color:
          allOf:
          - $ref: '#/components/schemas/Color'
          nullable: true
        killer:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
      xml:
        name: dragon
    Coordinates:
      type: object
      required:
      - x
      - y
      properties:
        x:
          type: integer
          format: int64
          minimum: -842
          description: Координата X. Значение должно быть больше -843
        y:
          type: number
          format: float
          description: Координата Y
      xml:
        name: coordinates
    Person:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          description: Имя человека. Не может быть пустым
        birthday:
          type: string
          format: date-time
          nullable: true
          description: Дата рождения
        nationality:
          allOf:
          - $ref: '#/components/schemas/Country'
          nullable: true
          description: Национальность
      xml:
        name: person
    Color:
      type: string
      enum:
      - GREEN
      - BLUE
      - YELLOW
      - ORANGE
      description: Цвет дракона
    Country:
      type: string
      enum:
      - FRANCE
      - ITALY
      - JAPAN
      description: Страна
    ProblemDetails:
      type: object
      description: Стандартное представление ошибки HTTP API (Problem Details).
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri-reference
          description: URI типа проблемы; about:blank используется для стандартной HTTP-ошибки.
        title:
          type: string
          description: Краткое название класса ошибки.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP-код ответа.
        detail:
          type: string
          description: Описание конкретной ошибки.
        instance:
          type: string
          format: uri-reference
          description: URI ресурса/операции, с которой связан пример ошибки.
      xml:
        name: problem
        namespace: urn:ietf:rfc:7807
servers:
- url: https://se.ifmo.ru/~s412958/soa-lab1
